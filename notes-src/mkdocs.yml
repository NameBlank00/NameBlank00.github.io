site_name: NameBlank00 · Notes
site_url: https://nameblank00.github.io/notes/
site_author: Jonathan A. Gonzales
repo_url: https://github.com/nameblank00/nameblank00.github.io
edit_uri: edit/main/notes-src/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Automatic mode }
  features:
    - navigation.sections     # Mathematics / Physics as sidebar headings
    - navigation.indexes      # section titles link to their index page
    - navigation.footer       # Previous / Next cards
    - navigation.top
    - navigation.path
    - toc.follow              # right-hand "On this page" tracks scrolling
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  homepage: https://nameblank00.github.io/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

