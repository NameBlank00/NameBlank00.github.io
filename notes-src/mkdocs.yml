site_name: NameBlank00 · Notes
site_url: https://nameblank00.github.io/notes/
site_author: Jonathan A. Gonzales
repo_url: https://github.com/nameblank00/nameblank00.github.io
edit_uri: edit/main/notes-src/docs/

theme:
  name: material
  custom_dir: overrides       # course-scoped sidebar (overrides/partials/nav.html)
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:                    # dark by default; the header button switches to light and back
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch to light mode }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
  features:
    - navigation.sections     # Mathematics / Physics as sidebar headings
    - navigation.indexes      # section titles link to their index page
    - navigation.footer       # Previous / Next cards
    - navigation.top
    - navigation.path
    - toc.follow              # right-hand "On this page" tracks scrolling
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  homepage: /                 # logo returns to the main site, not the notes home

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/textbooks.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

